name: Deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Dependency audit and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build

  deploy:
    name: Publish isolated release
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the validated commit using the restricted site key
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_PORT: '22'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' 'client-vps ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM//qmObzXxY3x0U/OA/RhxiSjLz5nvd+yOuwcSPlsTI' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=client-vps -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
